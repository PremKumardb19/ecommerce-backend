    const el = id => document.getElementById(id);

    // Connect Wallet
    el('connectWalletBtn').onclick = async function () {
      if (!window.ethereum) return alert("MetaMask is not installed!");
      try {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        userAddress = (await signer.getAddress()).toLowerCase();
        el('walletAddress').textContent = userAddress;

        // show admin panel if admin
        if (userAddress === adminAddress) {
          el('loadDisputesBtn').style.display = 'inline-block';
          el('adminPanelTitle').style.display = 'block';
        }
      } catch (err) {
        console.error("Wallet connect error", err);
        alert("Failed to connect wallet: " + err.message);
      }
    };
        // 🔥 Burn Tokens
    el('burnBtn').onclick = async function () {
      if (!userAddress || !signer) return alert("Connect your wallet first");
      const amount = el('burnAmount').value.trim();
      if (!amount) return alert("Enter amount to burn");

      try {
        const contract = new ethers.Contract(rewardTokenAddress, rewardTokenAbi, signer);
        const decimals = await contract.decimals();
        const parsedAmount = ethers.utils.parseUnits(amount, decimals);

        const tx = await contract.burn(parsedAmount);
        el('burnStatus').textContent = '⏳ Burning tokens TX ' + tx.hash;
        await tx.wait();

        // Notify backend
        await fetch("http://localhost:5000/api/rewards/burn", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ txHash: tx.hash, amount })
        });

        el('burnStatus').innerHTML = `✅ Tokens burned. TX: ${tx.hash}`;
      } catch (err) {
        console.error("Burn error", err);
        el('burnStatus').textContent = '❌ Burn failed: ' + err.message;
      }
    };
    // Load products
    async function loadProducts() {
      el('status').textContent = "Loading products...";
      el('productsGrid').innerHTML = '';
      const url = el('apiUrl').value.trim();
      let products = [];
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('Failed to fetch: ' + resp.status);
        products = await resp.json();
      } catch (err) {
        el('status').textContent = 'Error loading products: ' + err.message;
        return;
      }

      el('status').textContent = products.length + " products loaded";
      if (!Array.isArray(products) || products.length === 0) {
        el('productsGrid').innerHTML = "<div>No products found.</div>";
        return;
      }

      el('productsGrid').innerHTML = products.map(prod => `
        <div style="border:1px solid #ccc; margin:8px; padding:8px;">
          <strong>${prod.name || "Unnamed"}</strong> <br>
          <span>${prod.description || ""}</span><br>
          Price: ${prod.priceEth || ethers.utils.formatEther(prod.priceWei)} ETH <br>
          ${prod.forSale ? `
          <button onclick="placeOrder('${prod.productId}', this)" ${!userAddress ? 'disabled' : ''}>
            🛒 Buy Now
          </button>` : "<b>Sold Out</b>"}
        </div>
      `).join("");
    }

    // Load Orders
    async function loadOrders() {
      if (!userAddress) return alert("Connect your wallet first");
      el('ordersGrid').innerHTML = 'Loading your orders...';

      try {
        const resp = await fetch(`http://localhost:5000/api/orders/buyer/${userAddress}`);
        if (!resp.ok) throw new Error('Failed to fetch orders: ' + resp.status);
        const orders = await resp.json();

        if (!orders || orders.length === 0) {
          el('ordersGrid').innerHTML = "<div>No orders yet.</div>";
          return;
        }

        el('ordersGrid').innerHTML = orders.map(order => {
          let priceEth = order.priceWei
            ? ethers.utils.formatEther(order.priceWei)
            : order.value;
          return `
            <div style="border:1px solid #aaa; margin:8px; padding:8px;">
              <b>Order #${order.id}</b><br>
              Product: ${order.productId}<br>
              Seller: ${order.seller}<br>
              Price: ${priceEth} ETH <br>
              Status: ${order.statusName || order.status}<br>
              <button onclick="confirmDelivery('${order.id}')">📦 Confirm Delivery</button>
              <button onclick="openDispute('${order.id}')">⚠️ Open Dispute</button>
            </div>
          `;
        }).join("");

      } catch (err) {
        el('ordersGrid').innerHTML = "❌ Error loading orders: " + err.message;
      }
    }

          return `
            <div style="border:1px solid red; margin:8px; padding:8px;">
              <b>Disputed Order #${order.id}</b><br>
              Product: ${order.productId}<br>
              Buyer: ${order.buyer}<br>
              Seller: ${order.seller}<br>
              Price: ${priceEth} ETH <br>
              Status: ${order.statusName || order.status}<br>
              <button onclick="resolveDispute('${order.id}', false)">✅ Release to Seller</button>
              <button onclick="resolveDispute('${order.id}', true)">💸 Refund Buyer</button>
            </div>
          `;
        }).join("");

      } catch (err) {
        el('disputesGrid').innerHTML = "❌ Error loading disputes: " + err.message;
      }
    }

    // Place Order
    window.placeOrder = async function(productId, btn) {
      if (!userAddress || !signer) return alert("Please connect MetaMask first.");
      el('orderStatus').innerHTML = '';
      btn.disabled = true;
      btn.textContent = "⏳ Waiting for MetaMask...";

      let product;
      const url = el('apiUrl').value.trim();
      try {
        const resp = await fetch(url);
        const products = await resp.json();
        product = products.find(p => p.productId === productId);
        if (!product) throw new Error("Product not found.");
      } catch (err) {
        el('orderStatus').textContent = '❌ Product lookup failed: ' + err.message;
        btn.disabled = false;
        btn.textContent = "🛒 Buy Now";
        return;
      }

      try {
        const contract = new ethers.Contract(escrowAddress, escrowAbi, signer);
        const tx = await contract.placeOrder(product.onChainId, {
          value: ethers.utils.parseEther(product.priceEth.toString())
        });
        el('orderStatus').textContent = '⏳ Mining TX ' + tx.hash;
        await tx.wait();

        // Backend notify
        await fetch('http://localhost:5000/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId: product.productId, txHash: tx.hash, buyer: userAddress })
        });

        el('orderStatus').innerHTML = `✅ Order placed. TX: ${tx.hash}`;
        loadOrders();
      } catch (err) {
        el('orderStatus').textContent = '❌ Order failed: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "🛒 Buy Now";
      }
    };

    // Confirm Delivery
    window.confirmDelivery = async function(orderId) {
      try {
        const contract = new ethers.Contract(escrowAddress, escrowAbi, signer);
        const tx = await contract.confirmDelivery(orderId);
        el('orderStatus').textContent = '⏳ Confirming delivery TX ' + tx.hash;
        await tx.wait();
        await fetch(`http://localhost:5000/api/orders/${orderId}/deliver`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ txHash: tx.hash })
        });
        el('orderStatus').innerHTML = `✅ Delivery confirmed. TX: ${tx.hash}`;
        loadOrders();
      } catch (err) {
        el('orderStatus').textContent = '❌ Delivery confirmation failed: ' + err.message;
      }
    };

    // Open Dispute
    window.openDispute = async function(orderId) {
      try {
        const contract = new ethers.Contract(escrowAddress, escrowAbi, signer);
        const tx = await contract.openDispute(orderId);
        el('orderStatus').textContent = '⏳ Opening dispute TX ' + tx.hash;
        await tx.wait();
        await fetch(`http://localhost:5000/api/orders/${orderId}/dispute`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ txHash: tx.hash })
        });
        el('orderStatus').innerHTML = `⚠️ Dispute opened. TX: ${tx.hash}`;
        loadOrders();
      } catch (err) {
        el('orderStatus').textContent = '❌ Dispute failed: ' + err.message;
      }
    };

    // Resolve Dispute (admin only)
    window.resolveDispute = async function(orderId, refundBuyer) {
      if (userAddress !== adminAddress) return alert("Only admin can resolve disputes.");
      try {
        const contract = new ethers.Contract(escrowAddress, escrowAbi, signer);
        const tx = await contract.resolveDispute(orderId, refundBuyer);
        el('orderStatus').textContent = '⏳ Resolving dispute TX ' + tx.hash;
        await tx.wait();
        await fetch(`http://localhost:5000/api/orders/${orderId}/resolve`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ txHash: tx.hash, refundBuyer })
        });
        el('orderStatus').innerHTML = `✅ Dispute resolved. TX: ${tx.hash}`;
        loadDisputedOrders();
      } catch (err) {
        el('orderStatus').textContent = '❌ Resolve dispute failed: ' + err.message;
      }
    };

    el('reloadBtn').onclick = loadProducts;
    el('loadOrdersBtn').onclick = loadOrders;
    el('loadDisputesBtn').onclick = loadDisputedOrders;

    loadProducts();
  </script>
</body>
</html>
